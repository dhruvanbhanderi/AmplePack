name: Comprehensive Testing Pipeline

on:
  push:
    branches: [ main, develop, mvc-stage-2 ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: 'Run full test suite including performance and security tests'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '18'

jobs:
  # Job 1: Build and Unit Tests
  build-and-unit-tests:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run unit tests
      run: |
        dotnet test AmplePack.Tests/AmplePack.Tests.csproj \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory TestResults \
          --collect:"XPlat Code Coverage" \
          --verbosity normal
          
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: TestResults
        
    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      with:
        file: TestResults/*/coverage.cobertura.xml
        flags: unit-tests
        
    - name: Generate version
      id: version
      run: |
        VERSION=$(date '+%Y.%m.%d')-${{ github.run_number }}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

  # Job 2: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    
    services:
      sqlite:
        image: alpine:latest
        options: --health-cmd "echo 'SQLite is ready'" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run integration tests
      run: |
        dotnet test AmplePack.Tests/AmplePack.Tests.csproj \
          --no-build \
          --configuration Release \
          --filter Category=Integration \
          --logger trx \
          --results-directory IntegrationTestResults \
          --collect:"XPlat Code Coverage" \
          --verbosity normal
          
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: IntegrationTestResults

  # Job 3: UI/E2E Tests with Playwright
  ui-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Install Playwright
      run: |
        cd AmplePack.UITests
        dotnet restore
        pwsh bin/Debug/net9.0/playwright.ps1 install --with-deps
        
    - name: Start application
      run: |
        cd AmplePack
        dotnet run --configuration Release --urls "https://localhost:5001" &

        # Wait for application to start
        timeout=60
        while ! curl -s -k https://localhost:5001 > /dev/null; do
          sleep 2
          timeout=$((timeout - 2))
          if [ $timeout -le 0 ]; then
            echo "Application failed to start within 60 seconds"
            exit 1
          fi
        done
        echo "Application started successfully"
        
    - name: Run Playwright tests
      run: |
        cd AmplePack.UITests
        dotnet test --configuration Release --logger trx --results-directory UITestResults
        
    - name: Upload UI test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-test-results
        path: AmplePack.UITests/UITestResults
        
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: AmplePack.UITests/playwright-report

  # Job 4: Performance Tests (runs only on main branch or manual trigger)
  performance-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    if: github.ref == 'refs/heads/main' || github.event.inputs.run_full_tests == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Build and start application
      run: |
        dotnet build --configuration Release
        cd AmplePack
        dotnet run --configuration Release --urls "https://localhost:5001" &
        
        # Wait for application to start
        timeout=60
        while ! curl -s -k https://localhost:5001 > /dev/null; do
          sleep 2
          timeout=$((timeout - 2))
          if [ $timeout -le 0 ]; then
            echo "Application failed to start within 60 seconds"
            exit 1
          fi
        done
        echo "Application started successfully"
        
    - name: Run performance tests
      run: |
        cd PerformanceTests
        chmod +x run-performance-tests.sh
        ./run-performance-tests.sh --url https://localhost:5001 --output ../performance-results
        
    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: performance-results

  # Job 5: Security Tests (runs only on main branch or manual trigger)
  security-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    if: github.ref == 'refs/heads/main' || github.event.inputs.run_full_tests == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Build and start application
      run: |
        dotnet build --configuration Release
        cd AmplePack
        dotnet run --configuration Release --urls "https://localhost:5001" &
        
        # Wait for application to start
        timeout=60
        while ! curl -s -k https://localhost:5001 > /dev/null; do
          sleep 2
          timeout=$((timeout - 2))
          if [ $timeout -le 0 ]; then
            echo "Application failed to start within 60 seconds"
            exit 1
          fi
        done
        echo "Application started successfully"
        
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'https://localhost:5001'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Run custom security tests
      run: |
        cd SecurityTests
        chmod +x run-security-tests.sh
        ./run-security-tests.sh --url https://localhost:5001 --output ../security-results
        
    - name: Upload security test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-test-results
        path: |
          security-results
          report_html.html
          report_json.json

  # Job 6: Build Artifacts and Release
  build-artifacts:
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, integration-tests, ui-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish application
      run: |
        dotnet publish AmplePack/AmplePack.csproj \
          --configuration Release \
          --output ./publish \
          --self-contained true \
          --runtime win-x64 \
          -p:PublishSingleFile=true \
          -p:Version=${{ needs.build-and-unit-tests.outputs.version }}
          
    - name: Create deployment package
      run: |
        cd publish
        zip -r ../AmplePack-${{ needs.build-and-unit-tests.outputs.version }}.zip .
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AmplePack-${{ needs.build-and-unit-tests.outputs.version }}
        path: AmplePack-${{ needs.build-and-unit-tests.outputs.version }}.zip

  # Job 7: Test Results Summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, integration-tests, ui-tests]
    if: always()
    
    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: '*-test-results'
        path: all-test-results
        
    - name: Display test summary
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "all-test-results/unit-test-results" ]; then
          echo "## Unit Tests ?" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "all-test-results/integration-test-results" ]; then
          echo "## Integration Tests ?" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests completed successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "all-test-results/ui-test-results" ]; then
          echo "## UI Tests ?" >> $GITHUB_STEP_SUMMARY
          echo "UI tests completed successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Version:** ${{ needs.build-and-unit-tests.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY